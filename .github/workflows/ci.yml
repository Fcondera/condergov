name: backend
on: [push, pull_request]
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: {global-json-file: global.json}
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release --logger 'trx;LogFileName=results.trx'
      - run: dotnet tool restore
      - run: dotnet ef migrations has-pending-model-changes --project src/CondertechGov.Infrastructure --no-build --configuration Release
      - run: dotnet list package --vulnerable --include-transitive --format json > dependency-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            **/TestResults/*.trx
            dependency-audit.json
